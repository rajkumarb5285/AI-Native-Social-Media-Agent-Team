services:
  - type: web
    name: ai-native-social-agent-team
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os, uvicorn; uvicorn.run('app.main:app', host='0.0.0.0', port=int(os.environ.get('PORT', 10000)))"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: AI Native Social Agent Team
      - key: DATABASE_PATH
        value: ./agent_runs.db
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_TIMEOUT_SECONDS
        value: "45"
      - key: ENABLE_LIVE_SEARCH
        value: "false"
      - key: TAVILY_API_KEY
        sync: false
