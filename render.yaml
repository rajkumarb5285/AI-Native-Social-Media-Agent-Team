services:
  - type: web
    name: ai-native-social-agent-team
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: AI Native Social Agent Team
      - key: DATABASE_PATH
        value: ./agent_runs.db
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_TIMEOUT_SECONDS
        value: "45"
      - key: ENABLE_LIVE_SEARCH
        value: "false"
      - key: TAVILY_API_KEY
        sync: false
