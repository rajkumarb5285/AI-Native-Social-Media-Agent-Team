name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run test suite
        env:
          ENVIRONMENT: test
          JWT_SECRET: test-only-secret-that-is-long-enough
          TOKEN_ENCRYPTION_KEY: test-only-encryption-secret
          DATABASE_PATH: ./test-agent-runs.db
        run: pytest -q
